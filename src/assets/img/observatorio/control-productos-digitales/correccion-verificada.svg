<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Ciclo de una corrección verificada</title><desc id="desc">Evaluar la afectación, validar la corrección, desplegar por grupos y verificar el estado instalado y la recuperación. La contención y las notificaciones necesarias se realizan en paralelo; no se espera a terminar el parche.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker></defs><rect width="1200" height="850" rx="20" fill="#0b1f3a"/><g font-family="sans-serif" fill="#f8fafc"><text x="44" y="65" font-size="36" fill="#f8fafc">Una corrección termina cuando se verifica en el equipo</text><text x="44" y="110" font-size="26" fill="#cbd5e1">La notificación y la contención avanzan en paralelo cuando corresponda.</text><rect x="44" y="165" width="525" height="190" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="66" y="209" font-size="30" fill="#7dd3fc">EVALUAR</text><text x="66" y="254" font-size="26" fill="#f8fafc">Confirmar producto y versión afectados</text><text x="66" y="291" font-size="26" fill="#f8fafc">Valorar explotación, exposición e impacto</text><rect x="631" y="165" width="525" height="190" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="653" y="209" font-size="30" fill="#7dd3fc">VALIDAR</text><text x="653" y="254" font-size="26" fill="#f8fafc">Comprobar procedencia e integridad</text><text x="653" y="291" font-size="26" fill="#f8fafc">Probar funciones y recuperación</text><path d="M580 260 L618 260" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M895 370 L895 430" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="631" y="445" width="525" height="190" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="653" y="489" font-size="30" fill="#7dd3fc">DESPLEGAR</text><text x="653" y="534" font-size="26" fill="#f8fafc">Aplicar por grupos y vigilar el proceso</text><text x="653" y="571" font-size="26" fill="#f8fafc">Detener ante efectos no previstos</text><rect x="44" y="445" width="525" height="190" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="66" y="489" font-size="30" fill="#7dd3fc">VERIFICAR Y RECUPERAR</text><text x="66" y="534" font-size="26" fill="#f8fafc">Acreditar la versión realmente instalada</text><text x="66" y="571" font-size="26" fill="#f8fafc">Restaurar un estado seguro si falla</text><path d="M618 540 L580 540" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="44" y="705" font-size="28" fill="#fbbf24">CONTROL TRANSVERSAL</text><text x="44" y="753" font-size="26" fill="#f8fafc">Responsable · evidencias · accesos · comunicaciones · riesgo residual</text><text x="44" y="810" font-size="26" fill="#cbd5e1">Una reversión nunca debe reintroducir sin control una versión vulnerable.</text></g></svg>