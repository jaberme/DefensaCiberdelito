<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">De la dependencia al equipo instalado</title><desc id="desc">Una biblioteca se relaciona con el firmware que la incorpora y con los equipos donde se instaló. Es necesario conservar versión, origen, hash, SBOM, ubicación y responsable para responder a una alerta.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7dd3fc" stroke-width="2"/></marker></defs><rect width="1200" height="780" rx="20" fill="#0b1f3a"/><g font-family="sans-serif" fill="#f8fafc"><text x="44" y="65" font-size="38" fill="#f8fafc">¿Dónde está instalada la dependencia vulnerable?</text><text x="44" y="113" font-size="27" fill="#cbd5e1">La trazabilidad debe unir código, versión entregada y proceso real.</text><rect x="44" y="165" width="330" height="225" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="66" y="209" font-size="30" fill="#7dd3fc">COMPONENTE</text><text x="66" y="254" font-size="26" fill="#f8fafc">Biblioteca y versión</text><text x="66" y="291" font-size="26" fill="#f8fafc">Dependencias transitivas</text><text x="66" y="328" font-size="26" fill="#f8fafc">Origen y mantenimiento</text><rect x="435" y="165" width="330" height="225" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="457" y="209" font-size="30" fill="#7dd3fc">ARTEFACTO</text><text x="457" y="254" font-size="26" fill="#f8fafc">Firmware / imagen exacta</text><text x="457" y="291" font-size="26" fill="#f8fafc">Hash y SBOM asociados</text><text x="457" y="328" font-size="26" fill="#f8fafc">Prueba de procedencia</text><rect x="826" y="165" width="330" height="225" rx="14" fill="#132f50" stroke="#7dd3fc" stroke-width="2"/><text x="848" y="209" font-size="30" fill="#7dd3fc">INSTALACIÓN</text><text x="848" y="254" font-size="26" fill="#f8fafc">Equipo y configuración</text><text x="848" y="291" font-size="26" fill="#f8fafc">Ubicación y responsable</text><text x="848" y="328" font-size="26" fill="#f8fafc">Proceso al que da servicio</text><path d="M380 276 L425 276" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M771 276 L816 276" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="44" y="455" font-size="29" fill="#7dd3fc">Una alerta útil debe recorrer la cadena en ambos sentidos.</text><rect x="44" y="500" width="1112" height="172" rx="14" fill="#132f50" stroke="#fbbf24" stroke-width="2"/><text x="66" y="544" font-size="30" fill="#fbbf24">PREGUNTA OPERATIVA</text><text x="66" y="589" font-size="26" fill="#f8fafc">¿Qué unidades están afectadas y quién puede intervenir?</text><text x="66" y="626" font-size="26" fill="#f8fafc">¿Qué versión corrige el problema y cómo verificamos su instalación?</text><text x="44" y="730" font-size="26" fill="#cbd5e1">Una lista de software sin relación con los equipos deja el impacto sin resolver.</text></g></svg>