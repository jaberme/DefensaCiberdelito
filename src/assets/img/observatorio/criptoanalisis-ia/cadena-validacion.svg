<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de validación de un resultado de criptoanálisis asistido por inteligencia artificial</title>
  <desc id="desc">Cinco etapas conectadas: hipótesis, derivación matemática, implementación, ejecución reproducible y revisión experta. Una advertencia indica que una prueba de concepto valida un ataque concreto, pero no sustituye la evaluación completa del margen de seguridad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081d35"/>
      <stop offset="1" stop-color="#173a63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ed6e8"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="70" y="80" fill="#fff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">De una intuición a una evidencia revisable</text>
  <text x="70" y="118" fill="#b9d6ec" font-family="system-ui, sans-serif" font-size="20">La utilidad científica aparece cuando cada paso puede comprobarse y repetirse.</text>

  <g font-family="system-ui, sans-serif" filter="url(#shadow)">
    <g transform="translate(65 175)">
      <rect width="190" height="205" rx="20" fill="#fff"/>
      <circle cx="95" cy="54" r="27" fill="#e9f8fb" stroke="#1595aa" stroke-width="4"/>
      <path d="M82 54h26M95 41v26" stroke="#1595aa" stroke-width="4" stroke-linecap="round"/>
      <text x="95" y="112" text-anchor="middle" fill="#122c48" font-size="22" font-weight="700">1. Hipótesis</text>
      <text x="95" y="144" text-anchor="middle" fill="#425d75" font-size="16">Patrón, simetría o</text>
      <text x="95" y="168" text-anchor="middle" fill="#425d75" font-size="16">supuesto cuestionable</text>
    </g>
    <path d="M266 277H296" stroke="#5ed6e8" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(305 175)">
      <rect width="190" height="205" rx="20" fill="#fff"/>
      <path d="M64 64h62M72 42l46 44M118 42L72 86" stroke="#7656c7" stroke-width="4" stroke-linecap="round"/>
      <text x="95" y="112" text-anchor="middle" fill="#122c48" font-size="22" font-weight="700">2. Derivación</text>
      <text x="95" y="144" text-anchor="middle" fill="#425d75" font-size="16">Modelo matemático y</text>
      <text x="95" y="168" text-anchor="middle" fill="#425d75" font-size="16">coste esperado</text>
    </g>
    <path d="M506 277H536" stroke="#5ed6e8" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(545 175)">
      <rect width="190" height="205" rx="20" fill="#fff"/>
      <path d="M65 46L42 64l23 18M125 46l23 18-23 18M108 37L82 91" fill="none" stroke="#df8a1c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="112" text-anchor="middle" fill="#122c48" font-size="22" font-weight="700">3. Código</text>
      <text x="95" y="144" text-anchor="middle" fill="#425d75" font-size="16">Ataque implementado</text>
      <text x="95" y="168" text-anchor="middle" fill="#425d75" font-size="16">con límites explícitos</text>
    </g>
    <path d="M746 277H776" stroke="#5ed6e8" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(785 175)">
      <rect width="190" height="205" rx="20" fill="#fff"/>
      <circle cx="95" cy="63" r="31" fill="#e8f8ef" stroke="#23965b" stroke-width="4"/>
      <path d="M78 63l12 12 23-27" fill="none" stroke="#23965b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="112" text-anchor="middle" fill="#122c48" font-size="22" font-weight="700">4. Ejecución</text>
      <text x="95" y="144" text-anchor="middle" fill="#425d75" font-size="16">Resultado medible y</text>
      <text x="95" y="168" text-anchor="middle" fill="#425d75" font-size="16">reproducible</text>
    </g>
    <path d="M986 277H1016" stroke="#5ed6e8" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1025 175)">
      <rect width="110" height="205" rx="20" fill="#fff"/>
      <circle cx="55" cy="60" r="25" fill="#f2edff" stroke="#7656c7" stroke-width="4"/>
      <path d="M43 60l8 8 17-19" fill="none" stroke="#7656c7" stroke-width="4" stroke-linecap="round"/>
      <text x="55" y="111" text-anchor="middle" fill="#122c48" font-size="19" font-weight="700">5. Revisión</text>
      <text x="55" y="142" text-anchor="middle" fill="#425d75" font-size="14">Alcance,</text>
      <text x="55" y="163" text-anchor="middle" fill="#425d75" font-size="14">supuestos y</text>
      <text x="55" y="184" text-anchor="middle" fill="#425d75" font-size="14">margen</text>
    </g>
  </g>

  <g transform="translate(100 450)" font-family="system-ui, sans-serif">
    <rect width="1000" height="145" rx="22" fill="#fff3d6" stroke="#efa52d" stroke-width="3"/>
    <circle cx="65" cy="72" r="31" fill="#efa52d"/>
    <text x="65" y="83" text-anchor="middle" fill="#102b47" font-size="34" font-weight="800">!</text>
    <text x="120" y="55" fill="#5d3a08" font-size="22" font-weight="700">Una prueba de concepto responde a una pregunta concreta</text>
    <text x="120" y="91" fill="#6b4c1e" font-size="18">Demuestra que el ataque funciona bajo unas condiciones; la seguridad del sistema completo</text>
    <text x="120" y="119" fill="#6b4c1e" font-size="18">exige además revisión independiente, análisis del despliegue y evaluación del riesgo real.</text>
  </g>
</svg>
